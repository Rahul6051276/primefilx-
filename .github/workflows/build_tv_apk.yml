name: Build Primefilx Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: false

      - name: Regenerate Android Folder to Fix Unsupported Gradle
        run: |
          cd mobile_version
          # Purana kharab android folder hata kar bilkul naya v2 compatible android folder bana lo
          rm -rf android
          flutter create . --platforms=android --org com.example

      - name: Clean and Install Dependencies
        run: |
          cd mobile_version
          flutter clean
          flutter pub get

      - name: Build APK (Release)
        run: |
          cd mobile_version
          flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Primefilx Release v1.0.${{ github.run_number }}
          files: mobile_version/build/app/outputs/flutter-apk/app-release.apk
          body: "Automated manual build for Primefilx Android APK with fresh Gradle."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
