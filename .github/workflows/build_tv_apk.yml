name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: false

      - name: Prepare Clean Android Project
        run: |
          cd mobile_version
          flutter create . --platforms=android --org com.example.primefilx

      - name: Fix Gradle Wrapper Distribution
        run: |
          cd mobile_version/android
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-7.5-all.zip/gradle-8.3-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install Dependencies & Build APK
        run: |
          cd mobile_version
          flutter pub get
          flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Primeflix v1.0.${{ github.run_number }}
          files: mobile_version/build/app/outputs/flutter-apk/app-release.apk
          body: "Automated build for Primeflix streaming application."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
