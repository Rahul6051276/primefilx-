name: Build PrimeFlix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Scaffolding & Custom Kotlin Files
        working-directory: ./mobile_version
        run: |
          if [ ! -f "android/gradlew" ] || ( [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ] ); then
            mkdir -p /tmp/primeflix_backup
            cp -r android/app/src/main/kotlin /tmp/primeflix_backup/ 2>/dev/null || true
            cp -r android/app/src/main/res /tmp/primeflix_backup/ 2>/dev/null || true
            cp android/app/src/main/AndroidManifest.xml /tmp/primeflix_backup/AndroidManifest.xml 2>/dev/null || true
            rm -rf android
            flutter create . --platforms=android --org com.primeflix --project-name primeflix_app
            mkdir -p android/app/src/main
            cp -r /tmp/primeflix_backup/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
            cp -r /tmp/primeflix_backup/res/* android/app/src/main/res/ 2>/dev/null || true
            cp /tmp/primeflix_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

      - name: Register MainActivity, CinemaPlayerActivity & Media3
        working-directory: ./mobile_version
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              if "<application" in txt and "android:usesCleartextTraffic" not in txt:
                  txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              txt = re.sub(
                  r'android:name="(\.?MainActivity|com\.primeflix\.[a-zA-Z0-9_.]*\.MainActivity|com\.netflixpro\.[a-zA-Z0-9_.]*\.MainActivity)"',
                  'android:name="com.primeflix.app.MainActivity"',
                  txt
              )
              if "CinemaPlayerActivity" not in txt and "</application>" in txt:
                  activity_xml = """
                  <activity
                      android:name="com.primeflix.app.CinemaPlayerActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:screenOrientation="sensorLandscape"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />
                  </application>"""
                  txt = txt.replace("</application>", activity_xml, 1)
              manifest.write_text(txt, encoding="utf-8")

          media3_deps = """
          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-effect:1.4.1")
              implementation("androidx.media3:media3-common:1.4.1")
          }
          """

          for gfile in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if gfile.exists():
                  gtxt = gfile.read_text(encoding="utf-8")
                  if "media3-exoplayer" not in gtxt:
                      gtxt += "\n" + media3_deps
                      gfile.write_text(gtxt, encoding="utf-8")
                  break
          EOF

      - name: Install Dependencies
        working-directory: ./mobile_version
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile_version
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primeflix-release-apk
          path: mobile_version/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PrimeFlix v1.0.${{ github.run_number }}
          files: mobile_version/build/app/outputs/flutter-apk/app-release.apk