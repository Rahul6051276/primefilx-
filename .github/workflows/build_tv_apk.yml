Name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Setup & Build Mobile App
        run: |
          flutter create --org com.primeflix.app --project-name primeflix_mobile mobile_build_temp
          cp -r mobile_version/lib mobile_build_temp/
          cp mobile_version/pubspec.yaml mobile_build_temp/pubspec.yaml
          
          # Clean Mobile name
          sed -i 's/android:label="[^"]*"/android:label="Primeflix"/' mobile_build_temp/android/app/src/main/AndroidManifest.xml
          
          # Internet & Cleartext HTTP fix
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />' mobile_build_temp/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' mobile_build_temp/android/app/src/main/AndroidManifest.xml

          cd mobile_build_temp
          flutter pub get
          flutter build apk --release

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apks
          cp mobile_build_temp/build/app/outputs/flutter-apk/app-release.apk release_apks/Primeflix-Mobile.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Primeflix v1.0.${{ github.run_number }}
          body: |
            ## Primeflix Mobile v1.0.${{ github.run_number }}
            * Optimized Home Screen with fast loading & 200+ catalogs
            * IPTV & Xtream sources strictly filtered out
            * Direct Cloud Streaming Engine
          files: |
            release_apks/Primeflix-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
