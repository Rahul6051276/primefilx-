name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: false

      - name: Prepare Clean Android Project
        run: |
          cd mobile_version
          flutter create . --platforms=android --org com.example.primefilx

      - name: Install Dependencies & Build APK with Retry
        run: |
          cd mobile_version
          flutter pub get
          
          n=0
          until [ "$n" -ge 3 ]
          do
            flutter build apk --release && break
            n=$((n+1))
            echo "Build failed, retrying ($n/3)..."
            sleep 10
          done

      - name: Verify APK Existence
        run: |
          ls -lah mobile_version/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Primeflix v1.0.${{ github.run_number }}
          files: mobile_version/build/app/outputs/flutter-apk/app-release.apk
          body: "Automated build for Primeflix streaming application with 200+ rich catalogs and Web Series episode flow."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
